{% extends 'base.html' %}
{% block content %}

<h2 class="text-2xl font-bold mb-4">Sales</h2>

<table class="w-full bg-white shadow rounded">
    <thead class="border-b">
        <tr class="text-left">
            <th class="p-3">ID</th>
            <th class="p-3">Product</th>
            <th class="p-3">Qty</th>
            <th class="p-3">Total</th>
            <th class="p-3">Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for sale in sales %}
        <tr class="border-b">
            <td class="p-3">{{ sale.id }}</td>
            <td class="p-3">{{ sale.product.name }}</td>
            <td class="p-3">{{ sale.quantity }}</td>
            <td class="p-3">{{ sale.total_price }}</td>
            <td class="p-3 flex gap-2">
                <a href="{% url 'delete_sale' sale.id %}" class="text-red-600 hover:underline">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
